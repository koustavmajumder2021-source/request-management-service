spring:
  application:
    name: request-management-service
  # In-memory H2 by default; activate the "postgres" profile for PostgreSQL.
  datasource:
    url: jdbc:h2:mem:requests;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  mvc:
    problemdetails:
      enabled: true

app:
  pagination:
    default-size: 10
    max-size: 100

springdoc:
  swagger-ui:
    path: /swagger-ui.html

---
spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/requests}
    username: ${DB_USERNAME:requests}
    password: ${DB_PASSWORD:requests}
